<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Letter</title>

<style>

body{

font-family:Arial;

background:#fff6f8;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

text-align:center;

width:350px;

}

input{

width:100%;

padding:12px;

margin-top:20px;

font-size:16px;

}

button{

margin-top:20px;

padding:12px 25px;

background:#ff6b9d;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

#error{

color:red;

margin-top:15px;

}

</style>

</head>

<body>

<div class="card">

<h2>💌</h2>

<h3>Hi anh Bảo Lương yêu dấu, em Trúc Quỳnh đây!</h3>
<h3>Again, hôm nay em yêu anh hơn mọi ngày trước</h3>

<p>Hôm nay anh thế nào ạ?</p>

<input id="password">

<button onclick="check()">Unlock</button>

<p id="error"></p>

</div>

<script>

const LETTER = "https://aromatic-noodle-96c.notion.site/August-2026-3ae106c4ee0b8080a04ed4ef1fb58197?source=copy_link";


const API = "https://script.google.com/macros/s/AKfycbw3BG_LOIWZQ8O2jEseU1ksdp3Fxv9lLYkZkUUrJqMECqqX8ojRHWayTP_ygyt_kdr41A/exec";

function check(){

    const answer =
        document.getElementById("password").value;

    fetch(API,{

        method:"POST",

        body:JSON.stringify({

            answer:answer

        })

    })
    .finally(()=>{

        window.location.href=LETTER;

    });

}

</script>

</body>

</html>
