<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Letter</title>

<style>

body{

font-family:Arial;

background:#fff6f8;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

text-align:center;

width:350px;

}

input{

width:100%;

padding:12px;

margin-top:20px;

font-size:16px;

}

button{

margin-top:20px;

padding:12px 25px;

background:#ff6b9d;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

#error{

color:red;

margin-top:15px;

}

</style>

</head>

<body>

<div class="card">

<h2>💌</h2>

<h3>Anh Gia Bảo ơi, em Trúc Quỳnh đây❤️ </h3>
<h3>Hôm nay hãy nhớ là em yêu anh nhiều hơn mọi ngày nhé ạaa</h3>

<p>Nói em nghe, hôm nay của anh thế nào vậy ạ?</p>

<input id="password">

<button onclick="check()">Unlock</button>

<p id="error"></p>

</div>

<script>

const LETTER = "https://aromatic-noodle-96c.notion.site/August-2026-3ae106c4ee0b8080a04ed4ef1fb58197?pvs=74";

function check() {

    const input = document.getElementById("password").value.trim();

    if(input.length === 0){
        document.getElementById("error").innerHTML = "Ơ nói em biết đi này 🤍";
        return;
    }

    document.getElementById("error").innerHTML = "Em biết mà, em thươnggg ❤️";

    setTimeout(() => {
        window.location.href = LETTER;
    }, 700);

}
</script>

</body>

</html>
